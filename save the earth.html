<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eco-Guardian: The Green Word Challenge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #e0f2f1 0%, #b2dfdb 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        .arabic-text {
            font-family: 'Cairo', sans-serif;
            direction: rtl;
        }
        .card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
            padding: 2rem;
            transition: all 0.3s ease;
            position: relative;
        }
        .btn-choice {
            transition: all 0.2s;
            border: 2px solid #e2e8f0;
        }
        .btn-choice:hover {
            transform: translateY(-2px);
            border-color: #4db6ac;
            background-color: #f0fdfa;
        }
        .progress-bar {
            height: 10px;
            background: #e2e8f0;
            border-radius: 5px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: #4db6ac;
            transition: width 0.4s ease-out;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .trophy {
            font-size: 80px;
            animation: bounce 2s infinite ease-in-out;
        }
        /* AI Feature Styles */
        .ai-loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="game-container" class="card">
    <!-- Initial Loading State -->
    <div id="start-screen" class="text-center">
        <h1 class="text-4xl font-bold text-teal-800 mb-4">Eco-Guardian Challenge 🌍</h1>
        <p class="text-gray-600 mb-8">Save the earth by mastering environment vocabulary! Can you earn the Golden Trophy?</p>
        <button onclick="startGame()" class="bg-teal-600 hover:bg-teal-700 text-white font-bold py-4 px-10 rounded-full text-xl shadow-lg transition transform hover:scale-105">
            Start Mission
        </button>
    </div>

    <!-- Gameplay State -->
    <div id="quiz-screen" class="hidden">
        <div class="flex justify-between items-center mb-4">
            <span id="score-display" class="font-bold text-teal-700">Score: 0</span>
            <span id="level-display" class="bg-teal-100 text-teal-800 px-3 py-1 rounded-full text-sm font-semibold">Level 1: The Seed</span>
        </div>
        <div class="progress-bar mb-6">
            <div id="progress-fill" class="progress-fill" style="width: 0%"></div>
        </div>
        
        <div class="text-center mb-8">
            <p class="text-sm uppercase tracking-widest text-gray-400 mb-2">Translate this word/phrase:</p>
            <h2 id="question-word" class="text-3xl font-bold text-gray-800">The Earth</h2>
        </div>

        <div id="choices-grid" class="grid grid-cols-1 gap-4 mb-6">
            <!-- Buttons injected by JS -->
        </div>

        <!-- AI Hint Feature -->
        <div class="mb-4 text-center">
            <button id="ai-hint-btn" onclick="askEcoSage()" class="text-teal-600 text-sm font-semibold hover:underline flex items-center justify-center mx-auto">
                ✨ Ask Eco-Sage for a hint
            </button>
            <div id="ai-hint-response" class="hidden mt-2 p-3 bg-blue-50 text-blue-800 text-xs rounded-lg italic"></div>
        </div>

        <!-- Feedback Area -->
        <div id="feedback-area" class="hidden rounded-xl p-4 mb-4">
            <p id="feedback-text" class="font-bold mb-1"></p>
            <p id="feedback-hint" class="text-sm italic text-gray-700"></p>
        </div>
    </div>

    <!-- End Screen -->
    <div id="end-screen" class="hidden text-center">
        <div id="trophy-container" class="mb-4"></div>
        <h2 id="result-title" class="text-3xl font-bold mb-2">Mission Complete!</h2>
        <div class="grid grid-cols-2 gap-4 my-8">
            <div class="bg-gray-50 p-4 rounded-xl">
                <p class="text-gray-500 text-sm">Final Score</p>
                <p id="final-score" class="text-2xl font-bold text-teal-600">0</p>
            </div>
            <div class="bg-gray-50 p-4 rounded-xl">
                <p class="text-gray-500 text-sm">Accuracy</p>
                <p id="final-accuracy" class="text-2xl font-bold text-teal-600">0%</p>
            </div>
        </div>
        
        <div id="review-section" class="text-right mb-8 arabic-text hidden">
            <div class="flex justify-between items-center border-b pb-2 mb-3">
                 <button onclick="generateAIStory()" id="ai-story-btn" class="text-xs bg-purple-600 text-white px-3 py-1 rounded-full font-sans direction-ltr">
                    ✨ AI Review Story
                </button>
                <h3 class="text-lg font-bold text-red-600">كلمات بحاجة لمراجعة:</h3>
            </div>
            <ul id="review-list" class="space-y-2 text-gray-700 mb-4">
                <!-- List of wrong words -->
            </ul>
            <div id="ai-story-content" class="hidden text-sm bg-purple-50 p-4 rounded-xl text-left font-sans italic text-purple-900 leading-relaxed">
                <!-- AI Story goes here -->
            </div>
        </div>

        <button onclick="location.reload()" class="w-full bg-teal-600 text-white py-3 rounded-xl font-bold hover:bg-teal-700">
            Try Again
        </button>
    </div>
</div>

<script>
    const apiKey = ""; // Provided by environment
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'eco-guardian-vocab';

    const vocabulary = [
        { en: "the earth", ar: "الأرض", hint: "Our planet is called the earth.", level: 1 },
        { en: "the air", ar: "الهواء", hint: "We breathe the air.", level: 1 },
        { en: "hill", ar: "تلة", hint: "A small mountain is a hill.", level: 1 },
        { en: "trash", ar: "قمامة", hint: "Put your trash in the bin.", level: 1 },
        { en: "problem", ar: "مشكلة", hint: "Pollution is a big problem.", level: 1 },
        { en: "however", ar: "مع ذلك", hint: "It was raining; however, we went out.", level: 1 },
        { en: "the future", ar: "المستقبل", hint: "The future depends on our actions.", level: 1 },
        { en: "enough", ar: "كافٍ", hint: "We have enough food for the party.", level: 1 },
        { en: "instead of", ar: "بدلاً من", hint: "Use a bag instead of plastic.", level: 2 },
        { en: "as well as", ar: "بالإضافة إلى", hint: "He likes apples as well as oranges.", level: 2 },
        { en: "not too much", ar: "ليس كثيرًا", hint: "Eat healthy, not too much sugar.", level: 2 },
        { en: "to grow up", ar: "أن يكبر", hint: "When I grow up, I want to be a pilot.", level: 2 },
        { en: "to save", ar: "أن يوفر", hint: "We must save water.", level: 2 },
        { en: "happen", ar: "يحدث", hint: "What will happen if we don't recycle?", level: 2 },
        { en: "to collect", ar: "أن يجمع", hint: "Let's collect the trash.", level: 2 },
        { en: "to pack", ar: "أن يرزم", hint: "We need to pack our bags.", level: 2 },
        { en: "to prefer", ar: "أن يفضل", hint: "I prefer green tea.", level: 2 },
        { en: "goes into the air", ar: "ينتشر بالهواء", hint: "Smoke goes into the air.", level: 2 },
        { en: "I’m thinking about", ar: "أنا أفكر في شيء ما", hint: "I'm thinking about the planet.", level: 2 },
        { en: "to keep", ar: "أن يبقي", hint: "Keep the air clean.", level: 3 },
        { en: "to protect", ar: "أن يحمي", hint: "Trees help to protect the nature.", level: 3 },
        { en: "to throw away", ar: "أن يرمي", hint: "Don't throw away plastic.", level: 3 },
        { en: "to recycle", ar: "أن يعيد تدوير", hint: "Recycle your paper.", level: 3 },
        { en: "to reuse", ar: "أن يعيد استخدام", hint: "Reuse your water bottle.", level: 3 },
        { en: "to reduce", ar: "أن يقلل", hint: "Reduce the waste you make.", level: 3 },
        { en: "to pollute", ar: "أن يلوث", hint: "Factories pollute the river.", level: 3 },
        { en: "stop the waste", ar: "أوقف التبذير", hint: "We must stop the waste of food.", level: 4 },
        { en: "a wasteful person", ar: "شخص مبذر", hint: "Don't be a wasteful person.", level: 4 },
        { en: "a waste of time", ar: "تضييع وقت", hint: "Playing too many games is a waste of time.", level: 4 },
        { en: "stop wasting time", ar: "أوقف تبذير الوقت", hint: "Stop wasting time and study!", level: 4 }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let correctCount = 0;
    let incorrectWords = new Set();

    async function callGemini(prompt, systemPrompt = "") {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
        const payload = {
            contents: [{ parts: [{ text: prompt }] }],
            systemInstruction: { parts: [{ text: systemPrompt }] }
        };

        let delay = 1000;
        for (let i = 0; i < 5; i++) {
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!response.ok) throw new Error('API limit or error');
                const data = await response.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text || "No response found.";
            } catch (err) {
                if (i === 4) return "Connection error. Please try again later.";
                await new Promise(res => setTimeout(res, delay));
                delay *= 2;
            }
        }
    }

    async function askEcoSage() {
        const btn = document.getElementById('ai-hint-btn');
        const display = document.getElementById('ai-hint-response');
        const currentWord = vocabulary[currentQuestionIndex].en;

        btn.innerHTML = '<span class="ai-loading"></span> Thinking...';
        btn.disabled = true;

        const systemPrompt = "You are the Eco-Sage, a wise environmentalist helping 6th-grade English learners. Give a very short (1 sentence) hint in simple English that explains the word's importance to the environment. Do not use the word itself in the hint. Use encouraging tone.";
        const prompt = `Give me a hint for the word or phrase: "${currentWord}"`;

        const hint = await callGemini(prompt, systemPrompt);
        
        display.innerText = "✨ Eco-Sage: " + hint;
        display.classList.remove('hidden');
        btn.innerHTML = '✨ Ask Eco-Sage for a hint';
        btn.disabled = false;
    }

    async function generateAIStory() {
        const btn = document.getElementById('ai-story-btn');
        const display = document.getElementById('ai-story-content');
        const missedList = Array.from(incorrectWords).map(w => w.en).join(', ');

        btn.innerHTML = '<span class="ai-loading"></span> Generating Review Story...';
        btn.disabled = true;

        const systemPrompt = "You are an English teacher. Create a very short story (max 60 words) for a 12-year-old student using specific vocabulary. Use simple sentences. Bold the vocabulary words.";
        const prompt = `Write a short story about the environment using these words: ${missedList}`;

        const story = await callGemini(prompt, systemPrompt);
        
        display.innerHTML = "<strong>✨ Your Personal Review Story:</strong><br><br>" + story.replace(/\n/g, '<br>');
        display.classList.remove('hidden');
        btn.innerHTML = '✨ Story Generated!';
        btn.classList.add('bg-green-600');
    }

    function startGame() {
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        showQuestion();
    }

    function showQuestion() {
        const feedback = document.getElementById('feedback-area');
        const hintDisplay = document.getElementById('ai-hint-response');
        hintDisplay.classList.add('hidden');
        feedback.classList.add('hidden');
        feedback.className = "rounded-xl p-4 mb-4 hidden";

        const q = vocabulary[currentQuestionIndex];
        document.getElementById('question-word').innerText = q.en;
        document.getElementById('score-display').innerText = `Score: ${score}`;
        
        const levelNames = ["", "Seedling", "Sprout", "Protector", "Guardian"];
        document.getElementById('level-display').innerText = `Level ${q.level}: ${levelNames[q.level]}`;

        const progress = (currentQuestionIndex / vocabulary.length) * 100;
        document.getElementById('progress-fill').style.width = `${progress}%`;

        generateChoices(q);
    }

    function generateChoices(q) {
        const grid = document.getElementById('choices-grid');
        grid.innerHTML = '';
        let choiceCount = q.level === 1 ? 3 : (q.level === 4 ? 5 : 4);
        
        let choices = [q.ar];
        const otherArabs = vocabulary.filter(v => v.ar !== q.ar).map(v => v.ar);
        const shuffledDistractors = otherArabs.sort(() => 0.5 - Math.random());
        choices = [...choices, ...shuffledDistractors.slice(0, choiceCount - 1)];
        choices = choices.sort(() => 0.5 - Math.random());

        choices.forEach(choice => {
            const btn = document.createElement('button');
            btn.className = "btn-choice arabic-text bg-white p-4 rounded-xl text-lg font-bold text-gray-700 shadow-sm";
            btn.innerText = choice;
            btn.onclick = () => handleAnswer(choice, q.ar, q.hint);
            grid.appendChild(btn);
        });
    }

    function handleAnswer(selected, correct, hint) {
        const feedback = document.getElementById('feedback-area');
        const fText = document.getElementById('feedback-text');
        const fHint = document.getElementById('feedback-hint');
        const buttons = document.querySelectorAll('.btn-choice');

        buttons.forEach(b => b.disabled = true);

        if (selected === correct) {
            score += 20;
            correctCount++;
            feedback.classList.remove('hidden');
            feedback.classList.add('bg-green-100', 'text-green-800');
            fText.innerText = "Correct! أحسنت";
            fHint.innerText = "";
            setTimeout(() => nextQuestion(), 1000);
        } else {
            score = Math.max(0, score - 5);
            incorrectWords.add(vocabulary[currentQuestionIndex]);
            feedback.classList.remove('hidden');
            feedback.classList.add('bg-red-100', 'text-red-800');
            fText.innerHTML = `<span class="arabic-text">خطأ! الإجابة الصحيحة: ${correct}</span>`;
            fHint.innerText = "Hint: " + hint;

            const contBtn = document.createElement('button');
            contBtn.className = "mt-3 w-full bg-red-600 text-white py-2 rounded-lg font-bold";
            contBtn.innerText = "Understood";
            contBtn.onclick = nextQuestion;
            feedback.appendChild(contBtn);
        }
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < vocabulary.length) {
            showQuestion();
        } else {
            showEndScreen();
        }
    }

    function showEndScreen() {
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('end-screen').classList.remove('hidden');
        
        const accuracy = Math.round((correctCount / vocabulary.length) * 100);
        document.getElementById('final-score').innerText = score;
        document.getElementById('final-accuracy').innerText = accuracy + "%";

        const trophyContainer = document.getElementById('trophy-container');
        if (accuracy >= 80) {
            trophyContainer.innerHTML = '<div class="trophy">🏆</div>';
            document.getElementById('result-title').innerText = "Well Done, Master Guardian!";
        } else {
            trophyContainer.innerHTML = '<div class="text-6xl">🌱</div>';
            document.getElementById('result-title').innerText = "Good Effort! Keep Growing.";
        }

        if (incorrectWords.size > 0) {
            const list = document.getElementById('review-list');
            document.getElementById('review-section').classList.remove('hidden');
            list.innerHTML = '';
            incorrectWords.forEach(word => {
                const li = document.createElement('li');
                li.innerHTML = `<span class="font-bold text-teal-800">${word.en}</span>: ${word.ar}`;
                list.appendChild(li);
            });
        }
    }
</script>
</body>
</html>
